{% extends "base.html" %}{% block content %}<div style="max-width:900px;margin:22px auto;padding:20px"><h1>Map: {{route.name}}</h1><p>Paste the Google Maps route URL or save coordinates.</p><form method="post">{% csrf_token %}<p>Google Maps Route URL<br><input style="width:100%;padding:9px" name="google_maps_url" value="{{route.google_maps_url}}"></p><p><input name="map_latitude" placeholder="Latitude" value="{{route.map_latitude|default:''}}"> <input name="map_longitude" placeholder="Longitude" value="{{route.map_longitude|default:''}}"> <input name="distance_km" placeholder="Distance km" value="{{route.distance_km|default:''}}"> <input name="estimated_minutes" placeholder="Minutes" value="{{route.estimated_minutes|default:''}}"></p><h3>Stops</h3>{% for s in stops %}<div style="padding:10px;border:1px solid #eee;margin:7px 0"><strong>{{s.name}}</strong><br><input name="stop_url_{{s.id}}" placeholder="Google Maps URL" value="{{s.google_maps_url}}"> <input name="stop_lat_{{s.id}}" placeholder="Latitude" value="{{s.latitude|default:''}}"> <input name="stop_lng_{{s.id}}" placeholder="Longitude" value="{{s.longitude|default:''}}"></div>{% endfor %}<button type="submit">Save Map Data</button> <a href="{% url 'transport:route_maps' %}">Cancel</a></form></div>{% endblock %}
