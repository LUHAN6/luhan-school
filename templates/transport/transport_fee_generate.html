{% extends "base.html" %}
{% block content %}
<style>
.tf-page{max-width:1500px;margin:auto;padding:18px}.tf-hero{background:linear-gradient(135deg,#0f3d75,#1769aa);color:#fff;border-radius:16px;padding:20px;display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:14px}.tf-hero h1{margin:0;font-size:23px;font-weight:800}.tf-hero p{margin:5px 0 0;font-size:12px;opacity:.82}.tf-actions{display:flex;gap:7px;flex-wrap:wrap}.tf-actions a,.tf-btn{display:inline-block;text-decoration:none;border:0;border-radius:8px;padding:8px 11px;font-size:11px;font-weight:800;background:#fff;color:#0f3d75}.tf-btn.primary{background:#1769aa;color:#fff}.tf-btn.muted{background:#eef2f7;color:#334155}.tf-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.tf-kpi{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px}.tf-label{font-size:10px;text-transform:uppercase;font-weight:800;color:#64748b}.tf-value{font-size:23px;font-weight:850;color:#172033;margin-top:5px}.tf-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:12px;overflow:hidden}.tf-filter{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:8px;padding:12px;background:#f8fafc}.tf-filter label,.tf-form label{display:block;font-size:10px;font-weight:800;color:#64748b;margin-bottom:4px}.tf-filter input,.tf-filter select,.tf-form input,.tf-form select,.tf-form textarea{width:100%;padding:9px 10px;border:1px solid #dbe2ea;border-radius:8px;font-size:12px;background:#fff}.tf-table{width:100%;border-collapse:collapse}.tf-table th{font-size:9px;text-transform:uppercase;color:#64748b;background:#f8fafc;padding:9px 11px;text-align:left}.tf-table td{font-size:11px;color:#334155;padding:10px 11px;border-top:1px solid #f1f5f9}.tf-empty{text-align:center;padding:28px;color:#94a3b8}.tf-money{font-weight:800}.tf-badge{border-radius:999px;padding:4px 7px;font-size:9px;font-weight:800}.tf-paid{background:#dcfce7;color:#166534}.tf-partial{background:#fef3c7;color:#92400e}.tf-unpaid{background:#fee2e2;color:#991b1b}.tf-form{max-width:850px;margin:auto;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}.tf-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tf-form .actions{display:flex;gap:8px;margin-top:15px}@media(max-width:900px){.tf-kpis{grid-template-columns:repeat(2,1fr)}.tf-filter{grid-template-columns:1fr 1fr}}@media(max-width:600px){.tf-page{padding:10px}.tf-hero{display:block}.tf-actions{margin-top:12px}.tf-kpis{gap:7px}.tf-form-grid{grid-template-columns:1fr}.tf-table{display:block;overflow-x:auto;white-space:nowrap}}
</style>
<div class="tf-page"><div class="tf-form"><h1>Generate Transport Charges</h1><p>Select an academic year and term. Existing charges are skipped.</p><form method="post">{% csrf_token %}{% for field in form %}<div style="margin-bottom:12px">{{ field.label_tag }}{{ field }}</div>{% endfor %}<button class="tf-btn primary" type="submit">Generate Charges</button> <a class="tf-btn muted" href="{% url 'transport:transport_fee_dashboard' %}">Cancel</a></form></div></div>
{% endblock %}
